# Skill trigger-accuracy eval cases.
#
# Spec: docs/specs/skill-trigger-accuracy-eval.md  (backlog #165, issue #398)
# Runner: .agentcortex/tools/run_skill_eval.py
#
# WHAT THIS MEASURES: whether registry `detect_by.intent_patterns` data
# discriminates — i.e. does a natural phrasing reach the intended skill, and
# does a near-miss correctly fail to. Scored by importing the SHIPPED resolver
# (`trigger_runtime_core.skill_is_candidate`), never a matcher of its own.
#
# WHAT IT DOES NOT MEASURE: whether an agent routes correctly. That is a
# different surface and stays in #254. Do not rename this "effectiveness".
#
# Cases assert DESIRED routing. A case blocked on a live defect carries
# `known_gap`; those are printed on every run and their count is ratcheted,
# never silently passed. See spec §D-2.
#
# This file is data-only. It is loaded by no runtime workflow, and it does not
# ship downstream (same as governance.yaml — the runner ships, the data does not).

version: 1
description: Trigger-accuracy cases for the 14 kind:skill entries in trigger-registry.yaml.

# Ratchet: may decrease, never increase. See spec §D-2.
known_gap_baseline: 13

cases:
