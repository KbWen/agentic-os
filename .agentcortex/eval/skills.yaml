  # The 14th skill. `intent_patterns` is empty BY DESIGN — activation is
  # phase_scope-driven and verified: `resolve_runtime_contract.py
  # --classification feature --phase ship --platform claude` returns it with no
  # prompt at all. It is reachable through free text only by naming the skill,
  # because `values_match` prepends `entry["id"]`. Recorded rather than forced:
  # a "near-miss paraphrase" is undefined for a skill with no phrases, so this
  # entry takes the AC-2 exclusion path and carries no negative.
  - id: verifybeforedone-pos-by-name
    skill_id: verification-before-completion
    prompt: "run the verification before completion checks"
    classification: feature
    phase: ship
    expect_activation: true
    note: >-
      Reachable by name only; intent-first discovery does not apply here.
      Excluded from the near-miss requirement per AC-2.

  # ---------------------------------------------------------------------
  # Near-miss negatives — semantically adjacent, lexically disjoint from every
  # pattern AND from the skill id. Word-level paraphrase does NOT work: any
  # phrase carrying a pattern token matches (DEFECT-2), so these are built to
  # share meaning without sharing vocabulary.
  # ---------------------------------------------------------------------
  - id: tdd-neg
