# Skill trigger-accuracy eval cases.
#
# Spec: docs/specs/skill-trigger-accuracy-eval.md  (backlog #165, issue #398)
# Runner: .agentcortex/tools/run_skill_eval.py
#
# WHAT THIS MEASURES: whether registry `detect_by.intent_patterns` data
# discriminates LEXICALLY — does a phrasing reach the intended skill's patterns.
# Scored by importing the SHIPPED resolver (`trigger_runtime_core.skill_is_candidate`),
# never a matcher of its own.
#
# `expect_pattern_match` is a lexical claim, NOT an activation claim. A skill can
# load without any pattern matching (`load_policy: phase-entry`, or a firing
# `phase_condition`); a case whose negative sits in such a context must say so with
# `activates_anyway: true`, and the runner hard-fails an undeclared one. That is
# how a suite ends up asserting "the near-miss was correctly rejected" about a
# skill that loaded anyway — it happened here and review caught it.
#
# WHAT IT DOES NOT MEASURE: whether an agent routes correctly. That is a
# different surface and stays in #254. Do not rename this "effectiveness".
#
# Cases assert DESIRED routing. A case blocked on a live defect carries
# `known_gap`; those are printed on every run and their count is ratcheted,
# never silently passed. See spec §D-2.
#
# This file is data-only, loaded by no runtime workflow. Neither it NOR the runner
# ships downstream: `run_skill_eval.py` imports `trigger_runtime_core.py`, which is
# itself deliberately source-only along with the rest of the resolver toolchain, so
# a shipped runner could not start. Spec §D-5.

version: 1
description: Trigger-accuracy cases for the 14 kind:skill entries in trigger-registry.yaml.

# Ratchet: may decrease, never increase. See spec §D-2.
known_gap_baseline: 19

# Of those gaps, how many the user actually feels: the skill does NOT load by some
# other path. A gap that is not user-visible is still a data defect, but it does
# not cost the user the skill. Both counts are ratcheted.
user_visible_gap_baseline: 16

cases:
  # ---------------------------------------------------------------------
  # Positives — one per skill. Natural sentences that DO carry the trigger phrase
  # verbatim, because that is what `values_match`'s token-subset test requires:
  # strip the phrase and all 14 stop matching. So these prove "say the words and
  # it works" — NOT intent-first discovery. The DEFECT-3 block below is where the
  # actual commitment ("users should not have to memorise skill names") is measured.
  # ---------------------------------------------------------------------
