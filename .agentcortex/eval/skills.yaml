  # ---------------------------------------------------------------------
  # DEFECT-1 — CJK patterns are inert inside a natural zh-TW sentence.
  #
  # `normalize_text` splits on whitespace only, and Traditional Chinese has no
  # whitespace word boundaries, so a whole clause collapses to ONE token and a
  # CJK pattern is never a subset of it.
  #
  # Measured 2026-09-01, and the CONSTRUCTION is part of the claim: with each
  # pattern embedded in a zh-TW clause that adds no spaces around it (sentence
  # start, middle, or end), 21 of 21 are inert. Space-delimit the whole pattern
  # and 21 of 21 match. So the number is a property of the SENTENCE, not of the
  # registry: a pattern matches only when every one of its tokens is
  # whitespace-bounded, which zh-TW writing does not do. Three reviewers reached
  # 21/21, 14/21 and 1/7 from three different corpora -- quote the mechanism,
  # never a bare count.
  #
  # These cases assert the DESIRED routing (activation) and are expected to fail
  # today. They are the reason the ratchet exists: `AGENTS.md §Chat Language
  # Policy` supports zh-TW input, and `skill-ecosystem.md` commits to intent-first
  # discovery "not by memorizing skill names" — yet a zh-TW user must type the
  # trigger phrase in isolation for it to work, which is exactly memorizing it.
  #
  # Fix belongs to its own unit (it moves skill loading for every user). Related
  # but distinct: backlog #150, the plural/singular inflection gap.
  # ---------------------------------------------------------------------
  - id: tdd-pos-zhtw
    skill_id: test-driven-development
    prompt: "這次想先寫測試再實作"
    classification: feature
    phase: implement
    expect_pattern_match: true
    known_gap: DEFECT-1

  - id: sysdebug-pos-zhtw
