  # ---------------------------------------------------------------------
  # DEFECT-2 — single-token patterns over-trigger. `debug` is a subset of any
  # sentence containing that token, so an unrelated use of the word pulls the
  # skill in. Sited at a phase where the skill does NOT load by another path, so
  # the spurious load is the user's actual outcome.
  # ---------------------------------------------------------------------
  - id: sysdebug-overtrigger
    skill_id: systematic-debugging
    prompt: "I need to debug my understanding of the spec"
    classification: feature
    phase: plan
    expect_pattern_match: false
    known_gap: DEFECT-2

